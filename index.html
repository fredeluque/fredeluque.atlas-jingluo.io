<style>
/* Concepto: una lámina de atlas anatómico grabado sobre papel celadón; la figura es el centro,
   las fichas de los puntos se leen como fichas de herbolario. Bronce = acción/selección (agujas de bronce
   y estatua Tongren); bermellón = solo riesgo. Los colores de meridianos siguen los Cinco Elementos. */
:root {
  --bg: #ECEFEA; --surface: #F8F9F6; --surface-2: #E1E7E0; --surface-3: #D5DDD5;
  --ink: #1B2320; --ink-2: #4B5954; --ink-3: #6F7D78; --line: #C9D2CB; --line-2: #B7C2BA;
  --accent: #8F5C1A; --accent-2: #B07A33; --accent-wash: #EFE2CC; --on-accent: #FFFDF8;
  --danger: #B0332A; --danger-wash: #F6E4E0; --ok: #2F7350; --ok-wash: #DDEEE3;
  --fig: #FBFBF7; --fig-line: #34413C; --fig-detail: #7C8984; --fig-hair: #6B5A48; --nail: #EEF0EA;
  --halo: rgba(255,255,255,.92);
  --m-LU: #6B7B86; --m-LI: #8E9BA4; --m-ST: #B98410; --m-SP: #9C6A16; --m-HT: #C0302A; --m-SI: #DA6234;
  --m-BL: #2B5EA6; --m-KI: #223F73; --m-PC: #AE376B; --m-SJ: #D0517B; --m-GB: #3E8F45; --m-LV: #276236;
  --m-GV: #5B4FB0; --m-CV: #16817A; --m-EX: #8B6A3E;
  --el-madera: #3E8F45; --el-fuego: #C0302A; --el-tierra: #B98410; --el-metal: #7E8C96; --el-agua: #223F73;
  --f-display: "Zen Old Mincho", "Noto Serif SC", "Hiragino Mincho ProN", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hz: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --r-s: 6px;
  --head-h: 58px; --nav-h: 64px; --panel-w: 440px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111715; --surface: #18201E; --surface-2: #212B28; --surface-3: #2B3632; --ink: #E2E8E3; --ink-2: #A4B2AC; --ink-3: #7E8E88;
  --line: #2C3834; --line-2: #3A4843; --accent: #D59C50; --accent-2: #E6B675; --accent-wash: #3A2D1C; --on-accent: #1A1208;
  --danger: #EA6D60; --danger-wash: #3B2220; --ok: #6CC08E; --ok-wash: #1E3428;
  --fig: #222C29; --fig-line: #A3B5AE; --fig-detail: #6F817A; --fig-hair: #B79E86; --nail: #2C3733; --halo: rgba(17,23,21,.92);
  --m-LU: #A7B6C1; --m-LI: #C6CFD6; --m-ST: #E6B33A; --m-SP: #D49A45; --m-HT: #F0645B; --m-SI: #F48C5E;
  --m-BL: #6E9EE6; --m-KI: #8FA9E8; --m-PC: #E07AA6; --m-SJ: #F48FB0; --m-GB: #74C77A; --m-LV: #5FB070;
  --m-GV: #A69CF0; --m-CV: #4FC8BE; --m-EX: #CDA676;
  --el-madera: #74C77A; --el-fuego: #F0645B; --el-tierra: #E6B33A; --el-metal: #B4C2CC; --el-agua: #8FA9E8;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201E; --surface-2: #212B28; --surface-3: #2B3632; --ink: #E2E8E3; --ink-2: #A4B2AC; --ink-3: #7E8E88;
  --line: #2C3834; --line-2: #3A4843; --accent: #D59C50; --accent-2: #E6B675; --accent-wash: #3A2D1C; --on-accent: #1A1208;
  --danger: #EA6D60; --danger-wash: #3B2220; --ok: #6CC08E; --ok-wash: #1E3428;
  --fig: #222C29; --fig-line: #A3B5AE; --fig-detail: #6F817A; --fig-hair: #B79E86; --nail: #2C3733; --halo: rgba(17,23,21,.92);
  --m-LU: #A7B6C1; --m-LI: #C6CFD6; --m-ST: #E6B33A; --m-SP: #D49A45; --m-HT: #F0645B; --m-SI: #F48C5E;
  --m-BL: #6E9EE6; --m-KI: #8FA9E8; --m-PC: #E07AA6; --m-SJ: #F48FB0; --m-GB: #74C77A; --m-LV: #5FB070;
  --m-GV: #A69CF0; --m-CV: #4FC8BE; --m-EX: #CDA676;
  --el-madera: #74C77A; --el-fuego: #F0645B; --el-tierra: #E6B33A; --el-metal: #B4C2CC; --el-agua: #8FA9E8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.hz { font-family: var(--f-hz); font-weight: 500; }
.mono { font-family: var(--f-mono); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .005em; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.muted { color: var(--ink-2); }
a { color: var(--accent); }
[hidden] { display: none !important; }

/* ---------- Estructura ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
.top { position: relative; z-index: 40; display: flex; align-items: center; gap: 14px; height: var(--head-h); background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; }
.seal { width: 34px; height: 38px; flex: none; border-radius: 5px; background: var(--accent); color: var(--on-accent); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--f-hz); font-weight: 700; font-size: 14px; line-height: 1.05; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--on-accent) 35%, transparent); }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; white-space: nowrap; }
.brand small { display: block; font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; margin-top: -2px; white-space: nowrap; }
.search { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
.search input { width: 100%; height: 38px; border: 1px solid var(--line); background: var(--bg); border-radius: 19px; padding: 0 14px 0 38px; outline: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); }
.search svg { position: absolute; left: 12px; top: 10px; width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 10px; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.ico { width: 18px; height: 18px; flex: none; }

.tabs { display: flex; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); z-index: 30; }
.tab { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 14px 11px; color: var(--ink-2); font-weight: 700; font-size: 14.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab svg { width: 19px; height: 19px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
main { position: relative; min-height: 0; overflow: hidden; grid-row: 3; }
.page { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.narrow { max-width: 820px; }

/* ---------- Componentes ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.pcode { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; padding: 2px 7px 2px 6px; border-radius: 5px; color: var(--ink); background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap; line-height: 1.35; text-decoration: none; }
.pcode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
button.pcode { cursor: pointer; }
button.pcode:hover { background: color-mix(in srgb, var(--c) 26%, transparent); }
.pchip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 13.5px; color: var(--ink); }
.pchip:hover { border-color: var(--accent); }
.pchip .pcode { font-size: 12px; }
.pchip small { color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn svg { width: 17px; height: 17px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.warnbox { background: var(--danger-wash); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); color: var(--ink); border-radius: var(--r-s); padding: 10px 12px 10px 38px; position: relative; font-size: 14.5px; }
.warnbox::before { content: "!"; position: absolute; left: 11px; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: var(--bg); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
.notebox { background: var(--accent-wash); border-radius: var(--r-s); padding: 10px 12px; font-size: 14.5px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.danger { background: var(--danger-wash); color: var(--danger); }
.badge.acc { background: var(--accent-wash); color: var(--accent); }
.badge .hz { font-size: 12px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 10px; }
.sec-title h2 { font-size: 21px; }
.pagehead { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.pagehead h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.15; }
.pagehead p { margin: 4px 0 0; color: var(--ink-2); max-width: 65ch; }
.backrow { margin: -6px 0 10px; }
.backrow .btn { padding-left: 4px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.tile { text-align: left; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile h3 { font-size: 17px; }
.tile p { margin: 0; color: var(--ink-2); font-size: 14px; }
.kv { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 0; border-top: 1px solid var(--line); }
.kv > div { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > div:nth-child(odd) { font-weight: 700; padding-right: 14px; color: var(--ink); }
.kv > div:nth-child(even) { color: var(--ink-2); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 460px; background: var(--surface); }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; font-size: 13px; }
.tbl tr:last-child td { border-bottom: 0; }
.prose p { margin: 0 0 10px; max-width: 68ch; }
.prose h3 { font-size: 18px; margin: 22px 0 8px; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; max-width: 68ch; }
.prose li { margin: 3px 0; }
.list-bullets { margin: 0; padding-left: 20px; }
.list-bullets li { margin: 2px 0; }
.empty { padding: 30px 16px; text-align: center; color: var(--ink-2); }
input.field, select.field { height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; min-width: 0; }
input.field:focus, select.field:focus { outline: none; border-color: var(--accent); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1 1 220px; }

/* ---------- Mapa ---------- */
.map-layout { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); }
.map-main { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.map-bar { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
.map-row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-weight: 700; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.views-scroll { overflow-x: auto; scrollbar-width: none; min-width: 0; }
.views-scroll::-webkit-scrollbar { display: none; }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 32px; padding: 0 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
.toggle svg { width: 16px; height: 16px; }
.map-stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; background:
  radial-gradient(circle, color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--bg); }
.map-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; cursor: grab; }
.map-stage > svg.dragging { cursor: grabbing; }
.fig-outline path { fill: var(--fig-line); stroke: var(--fig-line); stroke-width: 2.6; stroke-linejoin: round; }
.fig-outline.thin path { stroke-width: 1.8; }
.fig-fill path { fill: var(--fig); stroke: none; }
.fd { fill: none; stroke: var(--fig-detail); stroke-width: 1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.fd.soft { stroke-opacity: .65; } .fd.faint { stroke-opacity: .38; }
.fd.hair { stroke: var(--fig-hair); stroke-width: 1.4; stroke-opacity: .55; } .fd.brow { stroke: var(--fig-hair); stroke-width: 2.2; stroke-opacity: .8; }
.fd.nail { fill: var(--nail); stroke-opacity: .55; } .fd.iris { fill: var(--surface-3); }
.fdd { fill: var(--fig-detail); } .fdd.faint { opacity: .45; }
.fig-ghost { opacity: .4; }
.fig-cap { font: 13px var(--f-body); fill: var(--ink-3); } .fig-cap.small { font-size: 11px; }
.mline { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; vector-effect: non-scaling-stroke; }
.pt { stroke: var(--fig); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.pt.dim { opacity: .13; }
.hl-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); }
.hl-row .nm { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.hl-row .nm small { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-vs { display: flex; gap: 4px; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; min-height: 0; }
.pt.hl { stroke: var(--ink); stroke-width: 1.5px; }
.pt.risk { stroke: var(--danger); stroke-width: 2px; }
.ptsel { fill: none; stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }
.ptpulse { fill: none; stroke: var(--accent); stroke-width: 2px; vector-effect: non-scaling-stroke; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ptpulse { animation: none; opacity: .6; } }
.hit { fill: transparent; cursor: pointer; }
.plabel { font-family: var(--f-mono); font-weight: 600; paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; pointer-events: none; }
.head-hint { cursor: zoom-in; fill: transparent; }
.zoom-ctl { position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.zoom-ctl button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.zoom-ctl button svg { width: 18px; height: 18px; }
.map-legend { position: absolute; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: 12px; color: var(--ink-3); background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px; max-width: min(60%, 360px); }
.hl-banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); padding: 6px 6px 6px 14px; border-radius: 20px; font-size: 13.5px; font-weight: 700; max-width: calc(100% - 24px); }
.hl-banner > span { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.3; }
.hl-banner b, .hl-banner small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-banner small { font-weight: 500; opacity: .78; font-size: 12px; }
@media (max-width: 760px) { .hl-banner { width: calc(100% - 24px); } }
.hl-banner { border-radius: 16px; }
.hl-banner button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 14px; height: 28px; padding: 0 10px; font-weight: 700; font-size: 12.5px; flex: none; }

.minimap { border: 1px solid var(--line); border-radius: var(--r); background: radial-gradient(circle, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1.2px) 0 0 / 18px 18px, var(--bg); overflow: hidden; position: relative; aspect-ratio: 4 / 3; max-width: 100%; cursor: zoom-in; }

}

<script>
/* ---- body.js ---- */
/* =========================================================================
   body.js — Figuras anatómicas SVG generadas a partir de puntos de referencia.
   Todas las vistas se dibujan en su propio sistema de coordenadas (viewBox).
   ========================================================================= */
(function (global) {
  'use strict';
  const r1 = n => Math.round(n * 10) / 10;

  // Catmull-Rom -> Bézier cúbica (curva suave que pasa por todos los puntos)
  function smooth(pts, closed, k) {
    k = k == null ? 1 : k;
    const n = pts.length;
    if (n < 2) return '';
    let d = 'M' + r1(pts[0][0]) + ',' + r1(pts[0][1]);
    const get = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6 * k, p1[1] + (p2[1] - p0[1]) / 6 * k];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6 * k, p2[1] - (p3[1] - p1[1]) / 6 * k];
      d += 'C' + r1(c1[0]) + ',' + r1(c1[1]) + ' ' + r1(c2[0]) + ',' + r1(c2[1]) + ' ' + r1(p2[0]) + ',' + r1(p2[1]);
    }
    return closed ? d + 'Z' : d;
  }
  const poly = (pts, closed) => 'M' + pts.map(p => r1(p[0]) + ',' + r1(p[1])).join('L') + (closed ? 'Z' : '');

  // interpolación de un perfil [[t, v], ...]
  function prof(p, t) {
    if (t <= p[0][0]) return p[0].slice(1);
    for (let i = 1; i < p.length; i++) {
      if (t <= p[i][0]) {
        const a = p[i - 1], b = p[i], f = (t - a[0]) / (b[0] - a[0]);
        return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f);
      }
    }
    return p[p.length - 1].slice(1);
  }

  // Segmento de miembro: A,B en coordenadas absolutas; perfil [[t, rA, rB]]
  // rA = radio hacia el lado "a" (normal izquierda del eje), rB = lado opuesto.
  function seg(A, B) {
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy);
    const d = [dx / L, dy / L], nrm = [d[1], -d[0]];
    return {
      A, B, L, d, n: nrm,
      at(t, off) { // off: desplazamiento perpendicular en unidades (+ = lado n)
        return [A[0] + d[0] * L * t + nrm[0] * off, A[1] + d[1] * L * t + nrm[1] * off];
      }
    };
  }
  function limbPath(s, profile, samples) {
    samples = samples || 14;
    const sideA = [], sideB = [];
    for (let i = 0; i <= samples; i++) {
      const t = i / samples, rr = prof(profile, t);
      sideA.push(s.at(t, rr[0]));
      sideB.push(s.at(t, -rr[1]));
    }
    const rEnd = prof(profile, 1), rSt = prof(profile, 0);
    const capE = s.at(1 + (rEnd[0] + rEnd[1]) / 2 / s.L * 0.85, (rEnd[0] - rEnd[1]) / 2);
    const capS = s.at(0 - (rSt[0] + rSt[1]) / 2 / s.L * 0.85, (rSt[0] - rSt[1]) / 2);
    const pts = sideA.concat([capE], sideB.reverse(), [capS]);
    return smooth(pts, true);
  }
  function capsule(A, B, rA, rB) {
    return limbPath(seg(A, B), [[0, rA, rA], [1, rB, rB]], 6);
  }
  const mirrorPts = (pts, cx) => pts.map(p => [2 * cx - p[0], p[1]]);
  const halfToFull = (half, cx) => { // half: [[u,y]] de arriba (centro) a abajo (centro)
    const L = half.map(p => [cx + p[0], p[1]]);
    const Rr = half.slice().reverse().map(p => [cx - p[0], p[1]]);
    return L.concat(Rr.slice(1, -1));
  };

  /* -------------------------------------------------------------------------
     CUERPO COMPLETO — vistas anterior y posterior (viewBox 0 0 500 1000)
     Coordenadas "medias": u = distancia a la línea media (lado lateral +).
     ------------------------------------------------------------------------- */
  const CX = 250;
  // Puntos de referencia (también usados por positions.js)
  const LM = {
    vertex: 22, chin: 150, notch: 186, nipple: [56.5, 272], xiphoid: 300, navel: 400, pubis: 492,
    cunChestH: 14.1,             // cun horizontal tórax/abdomen/espalda
    cunUpAbd: 12.5,              // cun vertical abdomen superior (xifoides-ombligo = 8)
    cunLowAbd: 18.4,             // cun vertical abdomen inferior (ombligo-pubis = 5)
    ics: { 1: 208, 2: 228, 3: 249, 4: 270, 5: 291, 6: 312, 7: 333 }, // espacios intercostales (línea paraesternal)
    // apófisis espinosas (vista posterior)
    sp: { C7: 182, T1: 193, T2: 204, T3: 215, T4: 226, T5: 237, T6: 248, T7: 259, T8: 270, T9: 282, T10: 294, T11: 307, T12: 321,
      L1: 337, L2: 355, L3: 373, L4: 391, L5: 410 },
    sac: { S1: 425, S2: 440, S3: 455, S4: 469, hiatus: 476, coccyx: 492 },
    gluteal: 545, popliteal: 722, patella: 708, kneeJoint: 727, latMall: 940, medMall: 926, ankle: 930,
    // brazo izquierdo (coordenadas medias): hombro, codo, muñeca, MCF
    arm: { S: [112, 214], E: [158, 388], W: [188, 520], M: [199, 585] },
  };
  LM.below = v => (LM.sp[v] + LM.sp[nextV(v)]) / 2;
  function nextV(v) {
    const order = ['C7', 'T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12', 'L1', 'L2', 'L3', 'L4', 'L5', 'S1'];
    const i = order.indexOf(v);
    return order[i + 1] === 'S1' ? 'S1' : order[i + 1];
  }
  LM.sp.S1 = LM.sac.S1;

  // Segmentos del brazo (en coordenadas medias, lado izquierdo; u creciente = lateral)
  const ARM = {
    up: seg(LM.arm.S, LM.arm.E),
    fo: seg(LM.arm.E, LM.arm.W),
    pa: seg(LM.arm.W, LM.arm.M),

  const Sync = {
    ref: null, timer: null, status: 'local',
    async init() {
      const c = global.claude;
      if (!c || typeof c.use !== 'function') return;
      try {
        const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
        if (!db || !user) return;
        const uid = await user.id();
        if (!uid) return;
        let cw = null; try { cw = await user.can('data.write'); } catch (e) { /* */ }
        if (cw === false && !(await user.isOwner())) return;
        this.ref = db.doc('data/users/' + uid + '/state');
        const snap = await this.ref.get();
        const remote = snap.exists ? snap.data() : null;
        if (remote && (remote.upd || 0) > (Store.d.upd || 0)) {
          Store.merge(JSON.parse(JSON.stringify(remote)));
          try { localStorage.setItem(Store.key, JSON.stringify(Store.d)); } catch (e) { /* */ }
          if (global.App) global.App.refresh();
        } else if ((Store.d.upd || 0) > ((remote && remote.upd) || 0)) this.push(true);
        this.status = 'cloud';
      } catch (e) { this.ref = null; }
    },
    push(now) {
      if (!this.ref) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(async () => {
        try { await this.ref.set(JSON.parse(JSON.stringify(Store.d))); this.status = 'cloud'; }
        catch (e) { const c = e && e.code; if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled') { this.ref = null; this.status = 'local'; } }
      }, now ? 0 : 1500);
    },
  };

  /* ---------------- Nomenclatura y piezas comunes ---------------- */
  const NOMS = { es: 'Española', cl: 'Española clásica', who: 'OMS' };
  const code = id => A.code(id, Store.d.set.nom);
  const P = id => A.BYID[id];
  const mcol = m => 'var(--m-' + m + ')';
  const mname = m => A.MER[m].short || A.MER[m].n;
  const codeTag = (id, btn) => {
    const p = P(id); if (!p) return esc(id);
    return btn ? '<button class="pcode" style="--c:' + mcol(p.m) + '" data-pt="' + id + '">' + esc(code(id)) + '</button>'
      : '<span class="pcode" style="--c:' + mcol(p.m) + '">' + esc(code(id)) + '</span>';
  };
  const ptChip = id => {
    const p = P(id); if (!p) return '<span class="badge">' + esc(id) + '</span>';
    return '<button class="pchip" data-pt="' + id + '">' + codeTag(id) + '<span>' + esc(p.py) + '</span>' + (Store.d.set.hz ? '<small class="hz">' + esc(p.hz) + '</small>' : '') + '</button>';
  };
  const ID_RE = /^(EX-[A-Z0-9]+|[A-Z]{2}\d{1,2})\b/;
  // texto con códigos (por ejemplo combinaciones "+ LV3: ...") -> enlaza los códigos
  const linkCodes = t => esc(t).replace(/\b(EX-[A-Z]+\d*|[A-Z]{2}\d{1,2})\b/g, (m) => P(m) ? '<button class="pcode" style="--c:' + mcol(P(m).m) + '" data-pt="' + m + '">' + esc(code(m)) + '</button>' : m);
  const convCodes = t => esc(t).replace(/\b(EX-[A-Z]+\d*|[A-Z]{2}\d{1,2})\b/g, m => P(m) ? esc(code(m)) : m);
  const addChip = s => { const m = String(s).match(ID_RE); if (m && P(m[1])) { const rest = s.slice(m[1].length).trim(); return ptChip(m[1]) + (rest ? ' <small class="muted">' + esc(rest) + '</small>' : ''); } return '<span class="badge">' + esc(s) + '</span>'; };

  /* ---------------- Índices inversos ---------------- */
  const COND_BY_PT = {};
  A.COND.forEach(c => {
    const s = new Set([...(c.base || []), ...(c.loc || []).flatMap(l => l[1]), ...c.pat.flatMap(p => [...(p.p || []), ...(p.a || []).map(x => (String(x).match(ID_RE) || [])[1]).filter(Boolean)])]);
    s.forEach(id => (COND_BY_PT[id] || (COND_BY_PT[id] = [])).push(c.id));
  });
  const REG_BY_PT = {};
  A.REGIONS.forEach(r => r.loc.forEach(id => (REG_BY_PT[id] || (REG_BY_PT[id] = [])).push(r.id)));
  const COND = {}; A.COND.forEach(c => COND[c.id] = c);
  const REG = {}; A.REGIONS.forEach(r => REG[r.id] = r);
  const LEARN = {}; A.LEARN.forEach(s => LEARN[s.id] = s);

  /* ---------------- Vistas del mapa: preferencia ---------------- */
  const VIEW_PREF = ['headF', 'headL', 'hands', 'feet', 'ant', 'post', 'lat'];
  const bestView = id => { const ps = POS[id]; if (!ps) return null; for (const v of VIEW_PREF) if (ps[v] && ps[v].length) return v; return null; };

  /* ---------------- Líneas de meridianos por vista ---------------- */
  const rng = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };
  const SEQ = {
    BL: [rng(1, 10), rng(10, 30), rng(31, 35), [36, 37, 40], rng(41, 54), [54, 38, 39, 40], [40].concat(rng(55, 67))],
    ST: [rng(1, 8), [5].concat(rng(9, 45))],
    LV: [rng(1, 12), [12, 13, 14]],
  };
  const THR = { ant: 140, post: 140, lat: 140, headF: 170, headL: 150, hands: 100, feet: 90 };
  const LINES = {};
  function linesFor(view) {
    if (LINES[view]) return LINES[view];
    const out = [];
    A.MORDER.forEach(m => {
      if (m === 'EX') return;
      const seqs = SEQ[m] || [rng(1, A.MER[m].count)];
      let d = '';
      seqs.forEach(seq => {
        for (let i = 1; i < seq.length; i++) {
          const pa = (POS[m + seq[i - 1]] || {})[view], pb = (POS[m + seq[i]] || {})[view];
          if (!pa || !pb) continue;
          pa.forEach(a => {
            let best = null, bd = 1e9;
            pb.forEach(b => {
              if (a[2] && b[2] && a[2] !== b[2]) return; // mismo lado
              const dd = Math.hypot(a[0] - b[0], a[1] - b[1]);
              if (dd < bd) { bd = dd; best = b; }
            });
            if (best && bd < THR[view] && bd > 0.5) d += 'M' + a[0] + ',' + a[1] + 'L' + best[0] + ',' + best[1];
          });
        }
      });
      if (d) out.push({ m, d });
    });
    return (LINES[view] = out);
  }

  /* ---------------- Minimapa (imagen de localización) ---------------- */
  const CROP = { ant: 170, post: 170, lat: 170, headF: 250, headL: 250, hands: 230, feet: 220 };
  function miniMap(id, o) {
    o = o || {};
    const p = P(id), v = o.view || bestView(id);
    if (!v) return '';
    const V = B.VIEWS[v], ps = POS[id][v];
    const main = ps.find(q => q[2] !== 2) || ps[0];
    const hgt = CROP[v] * (o.scale || 1), wid = hgt * (o.aspect || 4 / 3);
    let x = main[0] - wid / 2, y = main[1] - hgt / 2;
    x = Math.max(V.vb[0] - wid * 0.1, Math.min(x, V.vb[0] + V.vb[2] - wid * 0.9));
    y = Math.max(V.vb[1] - hgt * 0.1, Math.min(y, V.vb[1] + V.vb[3] - hgt * 0.9));
    const r = hgt / 50;
    let s = '<svg viewBox="' + [x, y, wid, hgt].map(n => Math.round(n * 10) / 10).join(' ') + '" role="img" aria-label="Localización de ' + esc(code(id)) + ' en la vista ' + esc(V.name) + '">';
    s += B.figure(v);
    const ln = linesFor(v).find(l => l.m === p.m);
    if (ln && !o.noLine) s += '<path class="mline" style="stroke:' + mcol(p.m) + '" d="' + ln.d + '"/>';
    if (!o.quiz) Object.keys(POS).forEach(k => {
      const q = P(k); if (!q || q.m !== p.m || k === id || !POS[k][v]) return;
      POS[k][v].forEach(c => { s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + (r * 0.55) + '" fill="' + mcol(q.m) + '" opacity=".7"/>'; });
    });
    ps.forEach(c => {
      s += '<circle class="ptpulse" cx="' + c[0] + '" cy="' + c[1] + '" r="' + (r * 1.1) + '"/>';
      s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + r + '" fill="' + (o.quiz ? 'var(--accent)' : mcol(p.m)) + '" stroke="var(--fig)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
    });
    if (!o.quiz) {
      const fs = hgt / 17;
      s += '<text class="plabel" x="' + (main[0] + r * 1.6) + '" y="' + (main[1] + fs * 0.35) + '" font-size="' + fs + '" stroke-width="' + fs / 4 + '" fill="' + mcol(p.m) + '">' + esc(code(id)) + '</text>';
    }
    return s + '</svg>';
  }

  /* ---------------- Diagrama de ángulo de punción ---------------- */
  function needleSvg(a) {
    const skin = '<path d="M2 34h80" stroke="var(--ink-3)" stroke-width="1.5"/><path d="M2 38h80M2 44h80" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="3 3"/><rect x="2" y="34" width="80" height="24" fill="var(--surface-2)" opacity=".55"/>';
    const nd = (x1, y1, x2, y2) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><line x1="' + x1 + '" y1="' + y1 + '" x2="' + (x1 + (x1 - x2) * 0.35) + '" y2="' + (y1 + (y1 - y2) * 0.35) + '" stroke="var(--ink-2)" stroke-width="4" stroke-linecap="round"/>';
    let n = '';
    if (a === 'perp') n = nd(42, 12, 42, 50);
    else if (a === 'obl') n = nd(22, 14, 50, 46);
    else if (a === 'trans') n = nd(10, 26, 66, 40);
    else if (a === 'sang') n = '<path d="M42 8l-4 22h8z" fill="var(--ink-2)"/><path d="M42 36c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z" fill="var(--danger)"/>';
    else if (a === 'sup') n = nd(42, 22, 42, 38);
    else n = '<circle cx="42" cy="26" r="14" fill="none" stroke="var(--danger)" stroke-width="2.5"/><path d="M32 36l20-20" stroke="var(--danger)" stroke-width="2.5"/>';
    return '<svg viewBox="0 0 84 60" aria-hidden="true">' + skin + n + '</svg>';
  }
  const ANG = { perp: 'Perpendicular (90°)', obl: 'Oblicua (≈45°)', trans: 'Transversal (10–15°)', sang: 'Sangría / punción superficial', sup: 'Superficial', none: 'No se punza' };

  /* ---------------- Ficha completa del punto ---------------- */
  function renderFicha(id) {
    const p = P(id); if (!p) return '<div class="empty">Punto no encontrado.</div>';
    const M = A.MER[p.m];
    const others = Object.keys(NOMS).filter(k => k !== Store.d.set.nom).map(k => NOMS[k] + ' ' + A.code(id, k)).join(' · ');
    const cats = A.catLabels(p);
    const dangers = p.t.filter(t => A.TAGS[t] && A.TAGS[t].danger);
    const v = bestView(id);
    const sameM = A.PTS.filter(q => q.m === p.m);
    const idx = sameM.indexOf(p), prev = sameM[idx - 1], next = sameM[idx + 1];
    const conds = (COND_BY_PT[id] || []).map(c => COND[c]);
    const regs = (REG_BY_PT[id] || []).map(r => REG[r]);
    let h = '<article class="ficha">';
    h += '<div class="f-head">';
    if (Store.d.set.hz) h += '<div class="f-hz' + (p.hz.replace(/\s|·/g, '').length > 3 ? ' h' : '') + '" lang="zh">' + Array.from(p.hz.replace(/\s|·/g, '')).map(c => '<span>' + esc(c) + '</span>').join('') + '</div>';
    h += '<div class="f-title"><div class="f-codes">' + codeTag(id) + (p.code && p.m === 'EX' ? '' : '') + '<span class="f-alt">' + esc(others) + '</span></div>';
    h += '<h2>' + esc(p.py) + '</h2><div class="tr">' + esc(p.tr) + '</div>';
    h += '<div class="f-mer">' + (p.m === 'EX' ? 'Punto extra · ' + esc(p.code || '') : 'Meridiano de <button data-go="m/' + p.m + '">' + esc(mname(p.m)) + '</button>' + (M.el ? ' · ' + A.EL[M.el].n : '')) + '</div>';
    h += '</div></div>';
    h += '<div class="f-actions"><button class="btn star" data-fav="' + id + '" aria-pressed="' + Store.isFav(id) + '">' + ico('star') + (Store.isFav(id) ? 'En favoritos' : 'Favorito') + '</button>';
    if (v) h += '<button class="btn" data-mapat="' + id + '">' + ico('pin') + 'Ver en el mapa</button>';
    h += '</div>';
    if (dangers.length || p.w) {
      h += '<div class="stack" style="gap:8px">';
      if (dangers.length) h += '<div class="cat-list">' + dangers.map(t => '<span class="badge danger">' + esc(A.TAGS[t].n) + '</span>').join('') + '</div>';
      if (p.w) h += '<div class="warnbox">' + linkCodes(p.w) + '</div>';
      h += '</div>';
    }
    if (v) h += '<div class="minimap" data-mapat="' + id + '" title="Abrir en el mapa">' + miniMap(id) + '<span class="mm-cap">Vista: ' + esc(B.VIEWS[v].name) + '</span></div>';
    if (cats.length) h += '<section class="f-sec"><h4>Categorías</h4><div class="cat-list">' + cats.map(c => '<span class="badge acc">' + (c.hz && Store.d.set.hz ? '<span class="hz">' + esc(c.hz) + '</span>' : '') + esc(c.t) + '</span>').join('') + '</div></section>';
    h += '<section class="f-sec"><h4>Localización</h4><p>' + linkCodes(p.loc) + '</p>' + (p.how ? '<p class="how"><b>Cómo encontrarlo: </b>' + linkCodes(p.how) + '</p>' : '') + '</section>';
    h += '<section class="f-sec"><h4>Punción</h4><div class="needle">' + needleSvg(p.a) + '<div><div class="nd-t">' + esc(ANG[p.a] || p.a) + (p.d && p.d !== '—' ? ' · ' + esc(p.d) : '') + '</div>' + (p.nd ? '<div class="muted">' + linkCodes(p.nd) + '</div>' : '') + '</div></div></section>';
    h += '<section class="f-sec"><h4>Moxibustión</h4><p class="muted">' + linkCodes(p.mx || (p.t.includes('nomoxa') ? 'Contraindicada según la tradición.' : 'Permitida.')) + '</p></section>';
    if (p.fx.length) h += '<section class="f-sec"><h4>Funciones (acciones en MTC)</h4><ul class="fx-list">' + p.fx.map(f => '<li>' + linkCodes(f) + '</li>').join('') + '</ul></section>';
    if (p.ind.length) h += '<section class="f-sec"><h4>Indicaciones</h4><div class="ind-chips">' + p.ind.map(f => '<span>' + convCodes(f) + '</span>').join('') + '</div></section>';
    if (p.cb.length) h += '<section class="f-sec"><h4>Combinaciones clásicas</h4><ul class="fx-list">' + p.cb.map(c => '<li>' + linkCodes(c) + '</li>').join('') + '</ul></section>';
    if (conds.length) h += '<section class="f-sec"><h4>Se usa en estos tratamientos</h4><div class="chips">' + conds.map(c => '<button class="chip" data-go="c/' + c.id + '">' + esc(c.n) + '</button>').join('') + '</div></section>';
    if (regs.length) h += '<section class="f-sec"><h4>Zona del cuerpo</h4><div class="chips">' + regs.map(r => '<button class="chip" data-go="z/' + r.id + '">' + esc(r.n) + '</button>').join('') + '</div></section>';
    h += '<section class="f-sec notes"><h4>Mis notas</h4><textarea id="note-' + id + '" data-note="' + id + '" placeholder="Apuntes de clase, sensaciones, dudas para el profesorado…">' + esc(Store.note(id)) + '</textarea></section>';
    h += '<nav class="f-nav">' + (prev ? '<button class="btn ghost" data-pt="' + prev.id + '">' + ico('back') + esc(code(prev.id)) + '</button>' : '<span></span>') + (next ? '<button class="btn ghost" data-pt="' + next.id + '">' + esc(code(next.id)) + ico('next') + '</button>' : '<span></span>') + '</nav>';
    return h + '</article>';
  }

  /* ---------------- Cajón (drawer) para la ficha ---------------- */
  const Drawer = {
    stack: [], el: null, scrim: null,
    open(id, push) {
      this.el = this.el || $('#drawer');
      if (push !== false && this.stack[this.stack.length - 1] !== id) this.stack.push(id);
      const back = this.stack.length > 1;
      this.el.innerHTML = '<div class="drawer-top">' + (back ? '<button class="btn ghost" data-dback>' + ico('back') + 'Atrás</button>' : '<span class="eyebrow" style="padding-left:6px">Ficha del punto</span>') + '<button class="icon-btn" data-dclose aria-label="Cerrar">' + ico('close') + '</button></div>' + renderFicha(id);
      this.el.scrollTop = 0;
      if (!this.el.classList.contains('open')) {
        this.scrim = document.createElement('div'); this.scrim.className = 'scrim'; this.scrim.dataset.dclose = '1';
        document.body.appendChild(this.scrim);
        this.el.classList.add('open');
      }
      this.el.focus && this.el.setAttribute('tabindex', '-1');
    },
    back() { this.stack.pop(); const id = this.stack[this.stack.length - 1]; if (id) this.open(id, false); else this.close(); },
    close() { if (!this.el) return; this.el.classList.remove('open'); this.stack = []; if (this.scrim) { this.scrim.remove(); this.scrim = null; } },
    get isOpen() { return !!(this.el && this.el.classList.contains('open')); },
  };

  /* ---------------- Búsqueda global ---------------- */
  let SIDX = null;
  function buildIndex() {
    SIDX = [];
    A.PTS.forEach(p => {
      const codes = ['es', 'cl', 'who'].map(k => norm(A.code(p.id, k))).concat([norm(p.id)]);
      SIDX.push({ t: 'p', id: p.id, codes, py: norm(p.py), name: norm(p.py + ' ' + p.tr + ' ' + p.hz + ' ' + (p.code || '')), more: norm(p.ind.join(' ') + ' ' + p.fx.join(' ')), s: p.s });
    });
    A.COND.forEach(c => SIDX.push({ t: 'c', id: c.id, name: norm(c.n), more: norm(c.kw + ' ' + c.d + ' ' + c.pat.map(x => x.n).join(' ')) }));
    A.MORDER.forEach(m => SIDX.push({ t: 'm', id: m, name: norm(A.MER[m].n + ' ' + A.MER[m].py + ' ' + A.MER[m].es + ' ' + A.MER[m].who + ' meridiano canal'), more: '' }));
    A.EXTRA.forEach(e => SIDX.push({ t: 'x', id: e.id, name: norm(e.n + ' ' + e.es + ' vaso extraordinario'), more: norm(e.uses) }));
    A.LEARN.forEach(s => SIDX.push({ t: 'l', id: s.id, name: norm(s.t + ' ' + s.sub), more: '' }));
    A.REGIONS.forEach(r => SIDX.push({ t: 'z', id: r.id, name: norm(r.n + ' zona'), more: norm(r.uses) }));
  }
  function search(q) {
    if (!SIDX) buildIndex();
    const nq = norm(q).trim(); if (!nq) return [];
    const nqc = nq.replace(/[\s-]/g, '');
    const res = [];
    SIDX.forEach(e => {
      let sc = 0;
      if (e.t === 'p') {
        if (e.codes.some(c => c.replace(/[\s-]/g, '') === nqc)) sc = 100;
        else if (nqc.length >= 2 && e.codes.some(c => c.replace(/[\s-]/g, '').startsWith(nqc)) && /\d/.test(nqc)) sc = 75;
        else if (e.py.startsWith(nq)) sc = 70;
        else if (e.name.includes(nq)) sc = 50;
        else if (nq.length > 3 && e.more.includes(nq)) sc = 18 + e.s * 2;
      } else {
        if (e.name.startsWith(nq)) sc = 65; else if (e.name.includes(nq)) sc = 55; else if (nq.length > 3 && e.more.includes(nq)) sc = 25;
      }
      if (sc) res.push([sc, e]);
    });
    res.sort((a, b) => b[0] - a[0]);
    return res.map(r => Object.assign({ sc: r[0] }, r[1]));
  }
  const TLAB = { p: 'Puntos', c: 'Síntomas y tratamientos', m: 'Meridianos', x: 'Vasos extraordinarios', l: 'Teoría y técnica', z: 'Zonas del cuerpo' };
  function searchHtml(q) {
    const r = search(q);
    if (!r.length) return '<div class="empty">Sin resultados para “' + esc(q) + '”.</div>';
    const groups = {};
    r.forEach(e => { (groups[e.t] || (groups[e.t] = [])).push(e); });
    const lim = { p: 8, c: 6, m: 4, x: 3, l: 4, z: 4 };
    let h = '';
    Object.keys(groups).sort((a, b) => groups[b][0].sc - groups[a][0].sc).forEach(t => {
      h += '<div class="sgroup eyebrow">' + TLAB[t] + '</div>';
      groups[t].slice(0, lim[t]).forEach(e => {
        if (t === 'p') { const p = P(e.id); h += '<button class="sitem" data-pt="' + e.id + '" data-sclose>' + codeTag(e.id) + '<span><b>' + esc(p.py) + '</b> <span class="hz muted">' + esc(Store.d.set.hz ? p.hz : '') + '</span><small>' + esc(p.tr) + ' · ' + convCodes(p.ind.slice(0, 3).join(', ')) + '</small></span></button>'; }
        else if (t === 'c') { const c = COND[e.id]; h += '<button class="sitem" data-go="c/' + e.id + '" data-sclose><span><b>' + esc(c.n) + '</b><small>' + c.pat.length + ' síndromes</small></span></button>'; }
        else if (t === 'm') { h += '<button class="sitem" data-go="m/' + e.id + '" data-sclose><span class="pcode" style="--c:' + mcol(e.id) + '">' + esc(A.MER[e.id].es) + '</span><span><b>' + esc(A.MER[e.id].n) + '</b></span></button>'; }
        else if (t === 'x') { const x = A.EXTRA.find(z => z.id === e.id); h += '<button class="sitem" data-go="aprender/mer" data-sclose><span><b>' + esc(x.n) + '</b><small>' + esc(x.es) + '</small></span></button>'; }
        else if (t === 'l') { const s = LEARN[e.id]; h += '<button class="sitem" data-go="t/' + e.id + '" data-sclose><span><b>' + esc(s.t) + '</b><small>' + esc(s.sub) + '</small></span></button>'; }
        else if (t === 'z') { const z = REG[e.id]; h += '<button class="sitem" data-go="z/' + e.id + '" data-sclose><span><b>' + esc(z.n) + '</b><small>' + esc(z.uses.split(';').slice(0, 3).join(';')) + '</small></span></button>'; }
      });
    });
    return h;
  }

  /* ---------------- Ajustes ---------------- */
  function openSettings() {

  /* ============================== DIAGRAMAS ============================== */
  const DG = {};

  DG.elements = function (sel, mode) {

      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, r = 40;
      const sx = x1 + ux * r, sy = y1 + uy * r, ex = x2 - ux * (r + 6), ey = y2 - uy * (r + 6);
      if (curve) { const mx = (sx + ex) / 2 - uy * curve, my = (sy + ey) / 2 + ux * curve; return '<path class="' + cls + '" d="M' + sx + ',' + sy + ' Q' + mx + ',' + my + ' ' + ex + ',' + ey + '" marker-end="url(#ah-' + cls + ')"/>'; }

    };
    let s = '<svg viewBox="0 0 400 380" role="img" aria-label="Diagrama de los Cinco Elementos"><defs>' +
      '<marker id="ah-gen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker>' +
      '<marker id="ah-ctl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker></defs>' +

  DG.clock = function () {
    const cx = 200, cy = 200, R = 170, r = 100;
    const now = new Date(), hr = now.getHours() + now.getMinutes() / 60;
    const ang = h => (h / 24) * Math.PI * 2 - Math.PI / 2;
    const pt = (h, rad) => [cx + Math.cos(ang(h)) * rad, cy + Math.sin(ang(h)) * rad];
    let s = '<svg viewBox="0 0 400 400" role="img" aria-label="Reloj de órganos">';

    A.CLOCK.forEach((m, i) => {
      const h0 = (3 + i * 2) % 24, h1 = h0 + 2;
      const inNow = (hr >= h0 && hr < h1) || (h0 === 23 && hr < 1) || (h0 === 23 && hr >= 23);
      if (inNow) curM = m;
      const [x0, y0] = pt(h0, R), [x1, y1] = pt(h1, R), [x2, y2] = pt(h1, r), [x3, y3] = pt(h0, r);
      const el = A.MER[m].el;

      const [tx, ty] = pt(h0 + 1, (R + r) / 2);
      s += '<text x="' + tx + '" y="' + (ty - 3) + '" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">' + esc(A.MER[m][Store.d.set.nom]) + '</text><text x="' + tx + '" y="' + (ty + 12) + '" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">' + h0 + '–' + (h1 % 24) + ' h</text></g>';
    });
    for (let h = 0; h < 24; h += 3) { const [x, y] = pt(h, R + 16); s += '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)">' + h + 'h</text>'; }
    const [hx, hy] = pt(hr, R + 2);

    return s + '</svg><p class="muted" style="text-align:center;margin:6px 0 0;font-size:13.5px">Toca un sector para abrir el meridiano. La aguja marca la hora actual de tu dispositivo.</p>';

        const id = A.PTS.find(p => p.m === m && p.t.includes(c[0])); if (!id) return null;
        const others = J.shuffle(A.PTS.filter(p => p.m === m && p.id !== id.id && p.s >= 1)).slice(0, 3);
        return { q: '¿Cuál es el punto <b>' + esc(c[1]) + '</b> del meridiano de ' + esc(A.MER[m].n) + '?', opts: J.shuffle([id].concat(others)).map(p => ({ h: ptLabel(p.id), ok: p === id })), exp: explain(id.id) };
      },
      () => { // meridiano
        const id = J.pick(pool.filter(x => J.P(x).m !== 'EX')); if (!id) return null; const p = J.P(id);
        const ms = J.shuffle(A.MORDER.filter(m => m !== p.m && m !== 'EX')).slice(0, 3).concat([p.m]);
        return { q: '¿A qué meridiano pertenece <b>' + esc(p.py) + '</b>' + (Store.d.set.hz ? ' <span class="hz">' + esc(p.hz) + '</span>' : '') + ' (“' + esc(p.tr) + '”)?', opts: J.shuffle(ms).map(m => ({ h: '<span class="pcode" style="--c:' + J.mcol(m) + '">' + esc(A.MER[m][Store.d.set.nom]) + '</span> ' + esc(A.MER[m].n), ok: m === p.m })), exp: explain(id) };
      },
      () => { // nombre
        const id = J.pick(pool); const p = J.P(id);
        const others = J.shuffle(A.PTS.filter(x => x.id !== id && (x.m === p.m || Math.random() < 0.05))).slice(0, 3);
        return { q: '¿Cómo se llama el punto ' + J.codeTag(id) + '?', opts: J.shuffle([p].concat(others)).map(x => ({ h: '<b>' + esc(x.py) + '</b> <span class="muted">· ' + esc(x.tr) + '</span>', ok: x === p })), exp: explain(id) };
      },
      () => { // indicación
        const id = J.pick(pool.filter(x => J.P(x).s >= 2)); if (!id) return null; const p = J.P(id);
        const ind = J.pick(p.ind.slice(0, 4)); const ni = J.norm(ind);
        const others = J.shuffle(A.PTS.filter(x => x.id !== id && x.s >= 2 && !x.ind.some(i => J.norm(i).includes(ni) || ni.includes(J.norm(i))))).slice(0, 3);
        if (others.length < 3) return null;
        return { q: '¿Qué punto está indicado para «' + J.convCodes(ind).split(esc(J.code(id))).join('…') + '»?', opts: J.shuffle([p].concat(others)).map(x => ({ h: ptLabel(x.id), ok: x === p })), exp: explain(id) };
      },
      () => { // localización (texto)
        const id = J.pick(pool); const p = J.P(id);
        const others = J.shuffle(A.PTS.filter(x => x.id !== id && x.m === p.m)).slice(0, 3);
        if (others.length < 3) return null;
        return { q: '¿Qué punto se localiza así?<p style="font-family:var(--f-body);font-weight:400;font-size:16px;margin:8px 0 0">' + esc(p.loc) + '</p>', opts: J.shuffle([p].concat(others)).map(x => ({ h: ptLabel(x.id), ok: x === p })), exp: explain(id) };
      },
      () => { // mapa
        const id = J.pick(pool.filter(x => J.bestView(x))); if (!id) return null;
        const v = J.bestView(id), pos = J.POS[id][v][0];
        const near = A.PTS.filter(x => x.id !== id && J.POS[x.id] && J.POS[x.id][v]).map(x => [x, Math.min(...J.POS[x.id][v].map(c => Math.hypot(c[0] - pos[0], c[1] - pos[1])))]).sort((a, b) => a[1] - b[1]).slice(0, 8);
        const others = J.shuffle(near).slice(0, 3).map(x => x[0]);
        return { q: '¿Qué punto está señalado en la imagen?', img: '<div class="minimap" style="aspect-ratio:4/3;cursor:default;margin-top:10px">' + J.miniMap(id, { quiz: true, view: v, noLine: true }) + '</div>', opts: J.shuffle([J.P(id)].concat(others)).map(x => ({ h: ptLabel(x.id), ok: x.id === id })), exp: explain(id) };
      },
      () => { // seguridad
        const emb = A.PTS.filter(p => p.t.includes('emb') && p.s >= 2); const id = J.pick(emb);
        const others = J.shuffle(A.PTS.filter(p => !p.t.some(t => A.TAGS[t] && A.TAGS[t].danger) && p.s >= 2 && !['SP', 'CV', 'KI'].includes(p.m))).slice(0, 3);
        return { q: '¿Cuál de estos puntos está <b>contraindicado en el embarazo</b>?', opts: J.shuffle([id].concat(others)).map(x => ({ h: ptLabel(x.id), ok: x === id })), exp: explain(id.id) + '<br>' + esc(id.w || '') };
      },
      () => { // síndrome
        const all = A.MORDER.filter(m => A.MER[m].syn && A.MER[m].syn.length).flatMap(m => A.MER[m].syn.map(s => [m, s]));
        const [m, sy] = J.pick(all);
        const others = J.shuffle(all.filter(x => x[1] !== sy)).slice(0, 3);
        return { q: '¿Qué síndrome describe este cuadro?<p style="font-family:var(--f-body);font-weight:400;font-size:16px;margin:8px 0 0">' + esc(sy[1]) + '</p>', opts: J.shuffle([[m, sy]].concat(others)).map(x => ({ h: esc(x[1][0]), ok: x[1] === sy })), exp: 'Ver la monografía del <button class="pcode" style="--c:' + J.mcol(m) + '" data-go="m/' + m + '">' + esc(A.MER[m].n) + '</button>' };
      },
      () => { // elemento
        const id = J.pick(pool.filter(x => J.P(x).sh)); if (!id) return null; const p = J.P(id);
        return { q: 'Según los Cinco Shu antiguos, ¿qué elemento tiene ' + ptLabel(id) + ' (punto ' + esc(A.SHU[p.sh].n) + ' de un canal ' + (A.MER[p.m].yy === 'yin' ? 'Yin' : 'Yang') + ')?', opts: J.shuffle(A.GEN.slice()).map(e => ({ h: '<span class="hz">' + A.EL[e].hz + '</span> ' + A.EL[e].n, ok: e === p.shEl })), exp: explain(id) };
      },
    ];
    for (let k = 0; k < 20; k++) { const q = J.pick(gens)(); if (q && q.opts.length >= 3) return q; }
    return null;
  }
  Study.quiz = function (el) {
    const s = Study;
    const topics = [['esencial', 'Puntos esenciales'], ['all', 'Todos los puntos'], ['fav', 'Mis favoritos']].concat(A.MORDER.filter(m => m !== 'EX').map(m => ['m:' + m, A.MER[m].n]));
    const setup = () => {
      el.innerHTML = '<div class="wrap narrow"><div class="backrow"><button class="btn ghost" data-go="estudio">' + ico('back') + 'Estudio</button></div><div class="pagehead"><span class="eyebrow">Test</span><h1>Configura el test</h1><p>Las preguntas se generan al azar a partir del atlas: tipos de punto, nombres, indicaciones, localización, mapa, elementos, síndromes y seguridad.</p></div>' +
        '<div class="toolbar"><select class="field grow" id="qt" aria-label="Tema">' + topics.map(t => '<option value="' + t[0] + '"' + (s.qTopic === t[0] ? ' selected' : '') + '>' + esc(t[1]) + '</option>').join('') + '</select>' +
        '<select class="field" id="qn" aria-label="Número de preguntas">' + [10, 20, 30].map(n => '<option' + (s.qN === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
        '<button class="btn primary" id="qgo">Empezar</button></div></div>';
      el.querySelector('#qgo').onclick = () => {
        s.qTopic = el.querySelector('#qt').value; s.qN = +el.querySelector('#qn').value;
        let pool = s.qTopic === 'all' ? A.PTS.map(p => p.id) : s.qTopic === 'fav' ? Store.d.favs.slice() : s.qTopic.startsWith('m:') ? A.PTS.filter(p => p.m === s.qTopic.slice(2)).map(p => p.id) : A.PTS.filter(p => p.s >= 3).map(p => p.id);
        if (pool.length < 4) pool = A.PTS.filter(p => p.s >= 3).map(p => p.id);
        const qs = []; let guard = 0;
        while (qs.length < s.qN && guard++ < 200) { const q = genQ(pool); if (q) qs.push(q); }
        s.qz = { qs, i: 0, ok: 0, ans: null, topic: (topics.find(t => t[0] === s.qTopic) || [0, ''])[1] };
        draw();
      };
    };
    const draw = () => {
      const z = s.qz;
      if (z.i >= z.qs.length) {
        Store.d.quiz.push({ d: Date.now(), ok: z.ok, n: z.qs.length, topic: z.topic }); Store.save();
        const pct = Math.round(z.ok / z.qs.length * 100);
        el.innerHTML = '<div class="wrap narrow"><div class="pagehead"><span class="eyebrow">Resultado</span><h1>' + z.ok + ' de ' + z.qs.length + ' (' + pct + ' %)</h1><p>' + (pct >= 85 ? 'Excelente dominio.' : pct >= 60 ? 'Buen trabajo: repasa las fichas de los fallos.' : 'Sigue practicando: las tarjetas te ayudarán a fijarlo.') + '</p></div><div class="fbtns" style="justify-content:flex-start"><button class="btn primary" id="qagain">Otro test</button><button class="btn" data-go="estudio">Volver a Estudio</button></div></div>';
        el.querySelector('#qagain').onclick = setup;
        return;
      }
      const q = z.qs[z.i];
      el.innerHTML = '<div class="wrap narrow"><div class="backrow"><button class="btn ghost" id="qback">' + ico('back') + 'Salir del test</button></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:6px"><span>Pregunta ' + (z.i + 1) + ' de ' + z.qs.length + '</span><span>' + z.ok + ' aciertos</span></div><div class="prog"><i style="width:' + (z.i / z.qs.length * 100) + '%"></i></div>' +
        '<div class="card qcard" style="margin-top:12px"><div class="q">' + q.q + '</div>' + (q.img || '') +
        '<div class="qopts">' + q.opts.map((o, k) => '<button class="qopt" data-qo="' + k + '"' + (z.ans != null ? ' disabled' : '') + '>' + o.h + '</button>').join('') + '</div>' +
        '<div id="qexp"></div></div></div>';
      el.querySelector('#qback').onclick = setup;
      el.querySelectorAll('[data-qo]').forEach(b => b.onclick = () => {
        if (z.ans != null) return;
        z.ans = +b.dataset.qo;
        const ok = q.opts[z.ans].ok;
        if (ok) z.ok++;
        el.querySelectorAll('[data-qo]').forEach((x, k) => { x.disabled = true; if (q.opts[k].ok) x.classList.add('ok'); else if (k === z.ans) x.classList.add('no'); });
        el.querySelector('#qexp').innerHTML = '<div class="' + (ok ? 'notebox' : 'warnbox') + '" style="margin-top:12px">' + (ok ? '<b>Correcto.</b> ' : '<b>No es correcto.</b> ') + q.exp + '</div><div class="fbtns" style="justify-content:flex-end"><button class="btn primary" id="qnext">' + (z.i + 1 < z.qs.length ? 'Siguiente' : 'Ver resultado') + ico('next') + '</button></div>';
        el.querySelector('#qnext').onclick = () => { z.i++; z.ans = null; draw(); el.closest('.page') && (el.closest('.page').scrollTop = 0); };
      });
    };
    if (s.qz && s.qz.i < s.qz.qs.length) draw(); else setup();
  };
  Study.favs = function (el) {
    const ids = Store.d.favs.filter(id => J.P(id));
    el.innerHTML = '<div class="wrap narrow"><div class="backrow"><button class="btn ghost" data-go="estudio">' + ico('back') + 'Estudio</button></div><div class="pagehead"><span class="eyebrow">Estudio</span><h1>Mis favoritos</h1></div>' +
      (ids.length ? '<div class="toolbar" style="margin-bottom:12px"><button class="btn" data-hl="' + ids.join(' ') + '" data-hlt="Mis favoritos">' + ico('pin') + 'Ver en el mapa</button></div><div class="listbox">' + ids.map(id => J.pRow(J.P(id))).join('') + '</div>' : '<div class="empty card">Aún no tienes favoritos. Abre la ficha de un punto y pulsa <b>Favorito</b>.</div>') + '</div>';
  };
  Study.notes = function (el) {
    const ids = Object.keys(Store.d.notes).filter(id => J.P(id));
    el.innerHTML = '<div class="wrap narrow"><div class="backrow"><button class="btn ghost" data-go="estudio">' + ico('back') + 'Estudio</button></div><div class="pagehead"><span class="eyebrow">Estudio</span><h1>Mis notas</h1></div>' +
      (ids.length ? '<div class="listbox">' + ids.map(id => '<button class="prow" data-pt="' + id + '">' + J.codeTag(id) + '<span class="nm"><b>' + esc(J.P(id).py) + '</b><span class="sub">' + esc(Store.note(id)) + '</span></span><span class="r"></span></button>').join('') + '</div>' : '<div class="empty card">Aún no hay notas. Escribe tus apuntes en el apartado <b>Mis notas</b> de cualquier ficha.</div>') + '</div>';
  };

  /* ============================== APLICACIÓN ============================== */
  const TABS = [['mapa', 'Mapa', 'map'], ['puntos', 'Puntos', 'list'], ['tratar', 'Tratar', 'leaf'], ['aprender', 'Aprender', 'book'], ['estudio', 'Estudio', 'cards']];
  const TAB_OF = { c: 'tratar', z: 'tratar', m: 'aprender', t: 'aprender' };
  const App = {
    tab: 'mapa', route: 'mapa', mapInit: false,
    init() {
      Store.init();
      $('#tabs').innerHTML = TABS.map(t => '<button class="tab" data-go="' + t[0] + '">' + ico(t[2]) + '<span>' + t[1] + '</span></button>').join('');
      this.bind();
      const h = (location.hash || '').replace('#', '');
      let start = 'mapa', openPt = null;
      if (/^p-/.test(h) && J.P(h.slice(2))) openPt = h.slice(2);
      else if (/^[czmt]-/.test(h)) start = h[0] + '/' + h.slice(2);
      else if (TABS.some(t => t[0] === h)) start = h;
      this.go(start);
      if (openPt) this.mapAt(openPt);
      J.Sync.init();
    },
    go(route) {
      const seg = route.split('/');
      const tab = TAB_OF[seg[0]] || seg[0];
      if (!TABS.some(t => t[0] === tab)) return;
      if (Drawer.isOpen && !(J.isDesk() && false)) Drawer.close();
      this.tab = tab; this.route = route;
      $$('#tabs .tab').forEach(b => b.setAttribute('aria-current', b.dataset.go === tab ? 'page' : 'false'));
      const main = $('#main');
      if (tab === 'mapa') {
        const root = MapV.build();
        if (root.parentNode !== main) { main.innerHTML = ''; main.appendChild(root); }
        if (!this.mapInit) { this.mapInit = true; requestAnimationFrame(() => MapV.setView('ant')); }
        else requestAnimationFrame(() => { MapV.computeBase(); MapV.apply(); MapV.renderPanel(); });
        return;
      }
      const page = document.createElement('div');
      page.className = 'page';
      main.innerHTML = ''; main.appendChild(page);
      const [a, b] = [seg[0], seg.slice(1).join('/')];
      if (a === 'puntos') V.puntos(page);
      else if (a === 'tratar') V.tratar(page, b);
      else if (a === 'c') V.cond(page, b);
      else if (a === 'z') V.zona(page, b);
      else if (a === 'aprender') V.aprender(page, b);
      else if (a === 'm') V.meridian(page, b);
      else if (a === 't') V.topic(page, b);
      else if (a === 'estudio') Study.render(page, b);
      page.scrollTop = 0;
    },
    refresh() {
      if (MapV.built) { MapV.renderFilter(); MapV.syncToggles(); if (MapV.root.isConnected) { MapV.renderScene(); MapV.decorate(); MapV.drawLabels(); MapV.renderPanel(); } }
      if (this.tab !== 'mapa') this.go(this.route);
      if (Drawer.isOpen) Drawer.open(Drawer.stack[Drawer.stack.length - 1], false);
    },
    openPoint(id) {
      if (this.tab === 'mapa' && J.isDesk() && !Drawer.isOpen) {
        const inView = J.POS[id] && J.POS[id][MapV.view];
        MapV.select(id, { center: true, view: inView ? null : (J.bestView(id) || null) });
        return;
      }
      Drawer.open(id);
    },
    pointFromMap(id) {
      if (J.isDesk()) MapV.select(id);
      else { MapV.select(id); MapV.peek(id); }
    },
    mapAt(id) {
      Drawer.close();
      this.go('mapa');
      const v = J.bestView(id);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (MapV.hl) MapV.clearHl();
        MapV.select(id, { view: v, center: true, zoom: v === 'ant' || v === 'post' || v === 'lat' ? 3 : 1.6 });
        if (!J.isDesk()) MapV.peek(id);
      }));
    },
    highlight(ids, title) {
      Drawer.close();
      this.go('mapa');
      requestAnimationFrame(() => requestAnimationFrame(() => MapV.highlight(ids, title)));
    },
    bind() {
      document.addEventListener('click', e => {
        const t = e.target.closest('[data-sclose],[data-pt],[data-go],[data-hl],[data-fav],[data-mapat],[data-ficha],[data-dclose],[data-dback],[data-selclear],[data-mermap],[data-mclose],[data-nom],[data-hzt]');
        if (!t) { if (!e.target.closest('#searchBox')) closeSearch(); return; }
        const d = t.dataset;
        if (d.sclose != null) closeSearch();
        if (d.fav) { const on = Store.toggleFav(d.fav); t.setAttribute('aria-pressed', on); t.innerHTML = ico('star') + (on ? 'En favoritos' : 'Favorito'); return; }
        if (d.mapat) { this.mapAt(d.mapat); return; }
        if (d.ficha) { Drawer.open(d.ficha); return; }
        if (d.dclose != null) { Drawer.close(); return; }
        if (d.dback != null) { Drawer.back(); return; }
        if (d.selclear != null) { MapV.clearSel(); return; }
        if (d.mermap) { const m = d.mermap; this.go('mapa'); requestAnimationFrame(() => requestAnimationFrame(() => MapV.showMeridian(m))); return; }
        if (d.mclose != null) { J.closeModal(); return; }
        if (d.nom) { Store.d.set.nom = d.nom; Store.save(); $$('[data-nom]').forEach(x => x.setAttribute('aria-pressed', x.dataset.nom === d.nom)); this.refresh(); return; }
        if (d.hzt != null) { Store.d.set.hz = !Store.d.set.hz; Store.save(); t.setAttribute('aria-pressed', Store.d.set.hz); this.refresh(); return; }
        if (d.hl) { this.highlight(d.hl.split(' ').filter(Boolean), d.hlt || 'Selección'); return; }
        if (d.pt) { if (Drawer.isOpen && t.closest('#drawer')) Drawer.open(d.pt); else this.openPoint(d.pt); return; }
        if (d.go) { if (t.closest('#drawer')) Drawer.close(); this.go(d.go); return; }
      });
      let nt;
      document.addEventListener('input', e => {
        const ta = e.target.closest && e.target.closest('textarea[data-note]');
        if (ta) { clearTimeout(nt); const id = ta.dataset.note, v = ta.value; nt = setTimeout(() => Store.setNote(id, v), 500); }
      });
      // búsqueda
      const q = $('#q'), sres = $('#sres');
      let st;
      q.addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => { const v = q.value.trim(); if (!v) { sres.hidden = true; return; } sres.innerHTML = J.searchHtml(v); sres.hidden = false; }, 120); });
      q.addEventListener('keydown', e => {
        const items = $$('.sitem', sres);
        let i = items.findIndex(x => x.classList.contains('active'));
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items.forEach(x => x.classList.remove('active')); i = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1); if (items[i]) { items[i].classList.add('active'); items[i].scrollIntoView({ block: 'nearest' }); } }
        else if (e.key === 'Enter') { e.preventDefault(); (items[i >= 0 ? i : 0] || { click() {} }).click(); }
        else if (e.key === 'Escape') closeSearch();
      });
      q.addEventListener('focus', () => { if (q.value.trim()) sres.hidden = false; });
      $('#msearch').addEventListener('click', () => { $('#searchBox').classList.add('mobile-open'); q.focus(); });
      $('#settingsBtn').addEventListener('click', () => J.openSettings());
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { if ($('.modal')) J.closeModal(); else if (Drawer.isOpen) Drawer.close(); else if (this.tab === 'mapa' && MapV.sel) MapV.clearSel(); }
        if (e.key === '/' && document.activeElement && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
      });
      global.addEventListener('resize', () => { if (this.tab === 'mapa' && MapV.built) MapV.renderPanel(); });
    },
  };
  function closeSearch() { const s = $('#sres'); if (s) s.hidden = true; const b = $('#searchBox'); if (b) b.classList.remove('mobile-open'); }

  global.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init()); else App.init();
})(window);

</script>
